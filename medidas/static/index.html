<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b4541a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Medidas">
  <title>Medidas</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icono-192.png">
  <link rel="apple-touch-icon" href="/icono-180.png">
  <link rel="stylesheet" href="/estilos.css">
</head>
<body>
  <header class="barra">
    <a href="#/" class="marca">📐 Medidas</a>
    <span id="estado-sync" class="sync" hidden></span>
    <button id="boton-menu" class="icono" aria-label="Menú" hidden>☰</button>
  </header>
  <nav id="menu" class="menu" hidden>
    <p id="menu-quien" class="suave"></p>
    <a href="#/usuarios" id="menu-usuarios" hidden>👥 Usuarios</a>
    <a href="#/contrasena">🔑 Cambiar mi contraseña</a>
    <button id="menu-salir" type="button">🚪 Salir</button>
  </nav>
  <main id="vista"></main>
  <div id="aviso" class="aviso" hidden></div>
  <div id="visor" class="visor" hidden>
    <button id="visor-cerrar" class="icono visor-cerrar" aria-label="Cerrar">✕</button>
    <div id="visor-marco" class="visor-marco"><img id="visor-img" alt="Foto de las medidas"></div>
    <button id="visor-borrar" class="boton peligro visor-borrar" hidden>🗑️ Borrar foto</button>
  </div>
  <script src="/app.js"></script>
</body>
</html>
