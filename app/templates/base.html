<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Recados{% endblock %} · {{ ajustes.nombre_negocio }}</title>
  {% block cabecera %}{% endblock %}
  <style>
    :root {
      --fondo: #f3f1ee; --tarjeta: #ffffff; --texto: #1f2328; --suave: #5f6670;
      --borde: #e2ded8; --acento: #b4541a; --alta: #c62828; --media: #d98a00; --baja: #2e7d32;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #16181b; --tarjeta: #1f2226; --texto: #ecedef; --suave: #a2a8b0;
        --borde: #30343a; --acento: #e07a3c; --alta: #ef5350; --media: #ffb300; --baja: #66bb6a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fondo); color: var(--texto);
           font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { background: var(--tarjeta); border-bottom: 1px solid var(--borde); padding: 14px 16px;
             position: sticky; top: 0; z-index: 1; }
    header h1 { margin: 0; font-size: 1.15rem; }
    header a { color: inherit; text-decoration: none; }
    header small { color: var(--suave); }
    main { max-width: 760px; margin: 0 auto; padding: 16px; }
    h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); margin: 24px 0 10px; }
    .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-left: 6px solid var(--borde);
               border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
    .tarjeta.alta { border-left-color: var(--alta); }
    .tarjeta.media { border-left-color: var(--media); }
    .tarjeta.baja { border-left-color: var(--baja); }
    .tarjeta.hecha { opacity: .65; }
    .fila { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .titulo { font-weight: 650; font-size: 1.05rem; margin: 0; }
    .titulo a { color: inherit; text-decoration: none; }
    .meta { color: var(--suave); font-size: .9rem; }
    .etiqueta { display: inline-block; font-size: .78rem; padding: 2px 8px; border-radius: 999px;
                border: 1px solid var(--borde); color: var(--suave); margin-right: 4px; }
    .etiqueta.alta { color: var(--alta); border-color: var(--alta); font-weight: 600; }
    ul.datos { margin: 8px 0 0; padding-left: 20px; }
    .accion { margin: 10px 0 0; padding: 8px 10px; background: var(--fondo); border-radius: 8px; }
    .botones { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .boton { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px;
             border-radius: 8px; border: 1px solid var(--borde); background: var(--tarjeta); color: var(--texto);
             font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
    .boton.principal { background: var(--acento); border-color: var(--acento); color: #fff; }
    form { margin: 0; }
    .vacio { color: var(--suave); text-align: center; padding: 32px 0; }
    .conversacion p { margin: 0 0 10px; padding: 8px 12px; border-radius: 10px; max-width: 88%; }
    .conversacion .asistente { background: var(--fondo); }
    .conversacion .cliente { background: var(--tarjeta); border: 1px solid var(--borde); margin-left: auto; }
    .conversacion b { display: block; font-size: .78rem; color: var(--suave); }
  </style>
</head>
<body>
  <header>
    <h1><a href="/">📋 Recados</a> <small>{{ ajustes.nombre_negocio }}</small></h1>
  </header>
  <main>
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
